              </div>
              <div class="cad-engine-badge">
                <span class="cad-status-dot" id="cad_status_dot"></span>
                <span id="cad_status_text">渲染管线预热中...</span>
              </div>
            </header>

            <main class="cad-center-hub">
              <h1 class="cad-hub-title">工程绘图工作台</h1>
              <p class="cad-hub-desc">轻量、专业、跨平台的在线 CAD 设计套件<br>支持 DWG / DXF 图纸解析、标注测量与二维编辑</p>

              <div class="cad-actions">
                <button class="cad-action-btn" id="cad_btn_open">
                  <div class="cad-btn-icon">📂</div>
                  <div class="cad-btn-texts">
                    <div class="cad-btn-label" id="cad_open_label">打开本地图纸</div>
                    <div class="cad-btn-sub">支持 .dwg, .dxf 等 CAD 文件，或直接拖拽至窗口</div>
                  </div>
                </button>

                <button class="cad-action-btn" id="cad_btn_new">
                  <div class="cad-btn-icon">➕</div>
                  <div class="cad-btn-texts">
                    <div class="cad-btn-label" id="cad_new_label">新建空白工程</div>
                    <div class="cad-btn-sub">进入标准毫米绘图环境，即刻开始绘制</div>
                  </div>
                </button>

                <button class="cad-action-btn" id="cad_btn_sample">
                  <div class="cad-btn-icon">⚡</div>
                  <div class="cad-btn-texts">
                    <div class="cad-btn-label">浏览机械示例</div>
                    <div class="cad-btn-sub">体验官方示例零件与平面工程图纸</div>
                  </div>
                </button>
              </div>

              <input type="file" id="cad_native_file_input" accept=".dwg,.dxf,.shx" multiple style="display:none">

              <div class="cad-progress-wrap">
                <div class="cad-progress-bar-bg">
                  <div class="cad-progress-bar-fill" id="cad_progress_fill"></div>
                </div>
                <div class="cad-progress-text">
                  <span id="cad_loading_stage">正在连接国内加速节点...</span>
                  <span id="cad_loading_pct">20%</span>
                </div>
              </div>
            </main>

            <footer class="cad-footer">
              💡 提示：可随时将图纸拖入窗口任意位置直接打开
            </footer>
          </div>"""

          shell_logic = """<script>
          (function() {
            var shell = document.getElementById('cad_welcome_shell');
            var progressFill = document.getElementById('cad_progress_fill');
            var loadingStage = document.getElementById('cad_loading_stage');
            var loadingPct = document.getElementById('cad_loading_pct');
            var statusDot = document.getElementById('cad_status_dot');
            var statusText = document.getElementById('cad_status_text');
            var btnOpen = document.getElementById('cad_btn_open');
            var btnNew = document.getElementById('cad_btn_new');
            var btnSample = document.getElementById('cad_btn_sample');
            var fileInput = document.getElementById('cad_native_file_input');
            var openLabel = document.getElementById('cad_open_label');
            var newLabel = document.getElementById('cad_new_label');

            var currentProgress = 20;
            window.__updateCadProgress = function(pct, text) {
              if (pct > currentProgress) currentProgress = pct;
              if (progressFill) progressFill.style.width = currentProgress + '%';
              if (loadingPct) loadingPct.innerText = currentProgress + '%';
              if (text && loadingStage) loadingStage.innerText = text;
            };

            var timer = setInterval(function() {
              if (window.__cadEngineReady) {
                clearInterval(timer);
                return;
              }
              if (currentProgress < 85) {
                currentProgress += Math.floor(Math.random() * 8) + 3;
                if (currentProgress > 85) currentProgress = 85;
                if (progressFill) progressFill.style.width = currentProgress + '%';
                if (loadingPct) loadingPct.innerText = currentProgress + '%';
                if (currentProgress > 50 && loadingStage) {
                  loadingStage.innerText = '正在初始化 WebGPU 图形管线与中文字库...';
                }
              }
            }, 350);

            function enterCanvas() {
              if (shell) {
                shell.classList.add('fade-out');
                setTimeout(function() {
                  shell.style.display = 'none';
                }, 400);
              }
            }

            function dispatchFiles(files) {
              var canvas = document.getElementById('cadcraft_canvas');
              if (!canvas || !files || files.length === 0) return;
              try {
                var dt = new DataTransfer();
                for (var i = 0; i < files.length; i++) {
                  dt.items.add(files[i]);
                }
                var dropEvt = new DragEvent('drop', {
                  bubbles: true,
                  cancelable: true,
                  dataTransfer: dt
                });
                canvas.dispatchEvent(dropEvt);
              } catch(e) {
                console.warn('Dispatch files failed:', e);
              }
            }

            window.addEventListener('TrunkApplicationStarted', function() {
              window.__cadEngineReady = true;
              clearInterval(timer);
              window.__updateCadProgress(100, '图形引擎就绪');
              if (statusDot) statusDot.classList.add('ready');
              if (statusText) statusText.innerText = '引擎已就绪';

              if (window.__stashedFiles) {
                dispatchFiles(window.__stashedFiles);
                enterCanvas();
              } else if (window.__wantsBlank) {
                enterCanvas();
              } else {
                if (newLabel) newLabel.innerText = '进入绘图工作区 ➔';
                if (btnNew) btnNew.style.borderColor = 'rgba(14, 165, 233, 0.6)';
              }
            });

            if (btnOpen && fileInput) {
              btnOpen.addEventListener('click', function() {
                fileInput.click();
              });
              fileInput.addEventListener('change', function(e) {
                if (e.target.files && e.target.files.length > 0) {
                  window.__stashedFiles = e.target.files;
                  if (openLabel) openLabel.innerText = '✅ 已载入: ' + e.target.files[0].name;
                  if (window.__cadEngineReady) {
                    dispatchFiles(window.__stashedFiles);
                    enterCanvas();
                  } else {
                    if (loadingStage) loadingStage.innerText = '图纸已暂存，引擎启动后立即呈现...';
                  }
                }
              });
            }

            if (btnNew) {
              btnNew.addEventListener('click', function() {
                if (window.__cadEngineReady) {
                  enterCanvas();
                } else {
                  window.__wantsBlank = true;
                  if (newLabel) newLabel.innerText = '正在进入工作区...';
                }
              });
            }

            if (btnSample) {
              btnSample.addEventListener('click', function() {
                if (location.search.indexOf('sample') !== -1) {
                  enterCanvas();
                } else {
                  var base = location.pathname;
                  location.href = base + '?sample';
                }
              });
            }

            window.addEventListener('dragover', function(e) {
              e.preventDefault();
              if (shell && !window.__cadEngineReady) shell.classList.add('dragover-highlight');
            });
            window.addEventListener('dragleave', function(e) {
              if (shell) shell.classList.remove('dragover-highlight');
            });
            window.addEventListener('drop', function(e) {
              e.preventDefault();
              if (shell) shell.classList.remove('dragover-highlight');
              if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                window.__stashedFiles = e.dataTransfer.files;
                if (openLabel) openLabel.innerText = '✅ 已拖入: ' + e.dataTransfer.files[0].name;
                if (window.__cadEngineReady) {
                  dispatchFiles(window.__stashedFiles);
                  enterCanvas();
                } else {
                  if (loadingStage) loadingStage.innerText = '图纸已暂存，引擎启动后立即呈现...';
                }
              }
            });
          })();
          </script>"""

          if "<head>" in html:
              html = html.replace("<head>", "<head>\n" + cache_script + "\n" + style_content)
          else:
              html = cache_script + "\n" + style_content + "\n" + html

          if "<body>" in html:
              html = html.replace("<body>", "<body>\n" + shell_dom)
          else:
              html = html + "\n" + shell_dom

          if "</body>" in html:
              html = html.replace("</body>", shell_logic + "\n</body>")
          else:
              html = html + "\n" + shell_logic

          html = re.sub(r'<div id="cadcraft_loading">[^<]*</div>', '', html)

          with open(html_path, "w", encoding="utf-8") as f:
              f.write(html)

          print("✅ 已成功将原生工作台首屏与时间差暂存引擎注入到 dist/web/index.html")
          PYEOF

          python3 inject_shell.py
          rm -f inject_shell.py

          # 4. 预先生成 Brotli 和 Gzip 压缩版本
          echo "=== 正在预压缩静态文件 ==="
          gzip -9 -k "$WASM_FILE" || true
          brotli -q 11 -k "$WASM_FILE" || true
          echo "=== 最终打包目录详情 ==="
          ls -lh dist/web/

      # 发布到 Cloudflare Pages（增加 3 次自动重试机制以防 Cloudflare 官方 API 抖动）
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 自动探测 Account ID
          ACCOUNTS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          DETECTED_ID=$(echo "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          
          if [ -n "$DETECTED_ID" ] && [ "$DETECTED_ID" != "null" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$DETECTED_ID"
          fi

          # 2. 发布（自动重试 3 次，防止 Cloudflare API 临时 503 波动）
          npm install -g wrangler
          for i in 1 2 3; do
            echo "正在尝试发布到 Cloudflare Pages (第 $i 次)..."
            if wrangler pages deploy dist/web --project-name=lotelf-cad --branch=main --commit-dirty=true; then
              echo "✅ 发布成功！"
              exit 0
            else
              echo "⚠️ 遇到 Cloudflare 官方 API 临时波动，等待 5 秒后重试..."
              sleep 5
            fi
          done
          exit 1
