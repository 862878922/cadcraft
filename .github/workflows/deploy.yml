server {
    listen 80 ; 
    listen 443 ssl ; 
    server_name cad.lotelf.com; 
    index index.php index.html index.htm default.php default.htm default.html; 
    access_log /www/sites/cad.lotelf.com/log/access.log main; 
    error_log /www/sites/cad.lotelf.com/log/error.log; 

    # ================= 🚀 核心加速：开启 Gzip 压缩（含 wasm） =================
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml application/wasm font/ttf font/otf image/svg+xml;
    # =========================================================================

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404; 
    }
    location ^~ /.well-known/acme-challenge {
        allow all; 
        root /usr/share/nginx/html; 
    }
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403; 
    }
    http2 on; 
    if ($scheme = http) {
        return 301 https://$host$request_uri; 
    }
    ssl_certificate /www/sites/cad.lotelf.com/ssl/fullchain.pem; 
    ssl_certificate_key /www/sites/cad.lotelf.com/ssl/privkey.pem; 
    ssl_protocols TLSv1.3 TLSv1.2; 
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:!aNULL:!eNULL:!EXPORT:!DSS:!DES:!RC4:!3DES:!MD5:!PSK:!KRB5:!SRP:!CAMELLIA:!SEED; 
    ssl_prefer_server_ciphers off; 
    ssl_session_cache shared:SSL:10m; 
    ssl_session_timeout 10m; 
    error_page 497 https://$host$request_uri; 
    proxy_set_header X-Forwarded-Proto https; 
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains"; 
    root /www/sites/cad.lotelf.com/index; 
    include /www/sites/cad.lotelf.com/proxy/*.conf; 
}
proxy_cache_path /www/sites/cad.lotelf.com/cache levels=1:2 keys_zone=proxy_cache_zone_of_cad.lotelf.com:50m max_size=1g inactive=24h;
