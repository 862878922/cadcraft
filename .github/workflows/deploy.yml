name: Deploy CADCraft to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Binaryen (wasm-opt)
        run: |
          sudo apt-get update && sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build and Optimize Web Application
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
          CARGO_PROFILE_RELEASE_LTO: "true"
        run: |
          cd apps/cadcraft-web
          trunk build --release
          cd ../..
          echo "=== 正在执行深度体积压缩 ==="
          WASM_FILE=$(ls dist/web/*_bg.wasm)
          echo "压缩前大小:"
          ls -lh "$WASM_FILE"
          
          # 开启所有现代 WebAssembly 特性支持并执行体积优化
          wasm-opt --all-features --enable-bulk-memory -Oz "$WASM_FILE" -o "$WASM_FILE"
          
          echo "压缩后大小:"
          ls -lh "$WASM_FILE"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 自动从 Token 探测真实 Account ID
          ACCOUNTS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          DETECTED_ID=$(echo "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          
          if [ -n "$DETECTED_ID" ] && [ "$DETECTED_ID" != "null" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$DETECTED_ID"
          fi

          # 2. 安装 Wrangler 并发布
          npm install -g wrangler
          wrangler pages deploy dist/web --project-name=lotelf-cad --branch=main --commit-dirty=true
