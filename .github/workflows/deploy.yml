          </style>"""

          shell_dom = """<div id="cad_welcome_shell">
            <div class="cad-grid-bg"></div>

            <header class="cad-top-bar">
              <div class="cad-logo-group">
                <div class="cad-logo-icon">📐</div>
                <span class="cad-brand-name">CADCraft</span>
