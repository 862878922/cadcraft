name: Deploy CADCraft to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install Modern Binaryen (wasm-opt v122)
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_122/binaryen-version_122-x86_64-linux.tar.gz | tar -xz
          sudo cp binaryen-version_122/bin/* /usr/local/bin/
          wasm-opt --version

      - name: Build and Compress Web Application
        run: |
          cd apps/cadcraft-web
          trunk build --release
          cd ../..
          echo "=== 检查打包产物 ==="
          WASM_FILE=$(ls dist/web/*_bg.wasm)
          echo "压缩前大小:"
          ls -lh "$WASM_FILE"
          
          # 使用官方最新版 wasm-opt 进一步深度压缩
          wasm-opt -Oz --strip-debug --strip-producers "$WASM_FILE" -o "$WASM_FILE" || true
          
          echo "压缩后大小:"
          ls -lh "$WASM_FILE"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. 自动从 Token 探测真实 Account ID
          ACCOUNTS_JSON=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          DETECTED_ID=$(echo "$ACCOUNTS_JSON" | jq -r '.result[0].id // empty')
          
          if [ -n "$DETECTED_ID" ] && [ "$DETECTED_ID" != "null" ]; then
            export CLOUDFLARE_ACCOUNT_ID="$DETECTED_ID"
          fi

          # 2. 安装 Wrangler 并发布
          npm install -g wrangler
          wrangler pages deploy dist/web --project-name=lotelf-cad --branch=main --commit-dirty=true
